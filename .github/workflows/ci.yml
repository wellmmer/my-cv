name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Secret terms for the leak guard; set with `gh secret set LEAK_TERMS`.
      LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run leak
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
